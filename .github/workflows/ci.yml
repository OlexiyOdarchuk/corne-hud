name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # The binary needs no system libraries to build: winit loads Wayland/X11/xkbcommon with dlopen
      # and rfd uses the XDG portal. The font is for tests that render text.
      - name: Fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - run: desktop-file-validate packaging/corne-hud.desktop
      - run: appstreamcli validate --no-net packaging/io.github.OlexiyOdarchuk.CorneHud.metainfo.xml

  firmware-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Screen code compiles on the host
        run: |
          cd firmware/keymaps/vial_tzt
          gcc -std=gnu11 -Wall -Wextra -Werror -fsyntax-only -I../../oled-sim/include oled_ui.c

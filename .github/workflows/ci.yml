name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  firmware-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Screen code compiles on the host
        run: |
          cd firmware/keymaps/vial_tzt
          gcc -std=gnu11 -Wall -Wextra -Werror -fsyntax-only -I../../oled-sim/include oled_ui.c

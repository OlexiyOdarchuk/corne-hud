<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Corne HUD</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c313c"/>
      <stop offset="1" stop-color="#15181e"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5466"/>
      <stop offset="1" stop-color="#383e4b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc56e"/>
      <stop offset="1" stop-color="#f3a847"/>
    </linearGradient>
  </defs>
  <!-- keyboard half -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#body)"/>
  <rect x="13.5" y="13.5" width="229" height="229" rx="46.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- OLED screen with a spectrum -->
  <rect x="38" y="32" width="180" height="56" rx="11" fill="#06070a" stroke="#4c5466" stroke-width="4"/>
  <g fill="url(#amber)">
    <rect x="58" y="58" width="12" height="18" rx="2"/>
    <rect x="76" y="46" width="12" height="30" rx="2"/>
    <rect x="94" y="54" width="12" height="22" rx="2"/>
    <rect x="112" y="42" width="12" height="34" rx="2"/>
    <rect x="130" y="50" width="12" height="26" rx="2"/>
    <rect x="148" y="60" width="12" height="16" rx="2"/>
    <rect x="166" y="48" width="12" height="28" rx="2"/>
    <rect x="184" y="56" width="12" height="20" rx="2"/>
  </g>
  <!-- column-staggered keys and a thumb cluster -->
  <g fill="url(#key)">
    <rect x="46" y="112" width="36" height="36" rx="7"/>
    <rect x="46" y="154" width="36" height="36" rx="7"/>
    <rect x="88" y="104" width="36" height="36" rx="7"/>
    <rect x="88" y="146" width="36" height="36" rx="7"/>
    <rect x="130" y="100" width="36" height="36" rx="7"/>
    <rect x="130" y="142" width="36" height="36" rx="7"/>
    <rect x="172" y="108" width="36" height="36" rx="7"/>
    <rect x="172" y="150" width="36" height="36" rx="7"/>
    <rect x="106" y="196" width="40" height="34" rx="7"/>
  </g>
  <rect x="156" y="198" width="46" height="34" rx="7" fill="url(#amber)" transform="rotate(14 179 215)"/>
</svg>

[package]
name = "corne-hud"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "OLED screens of the Corne split keyboard: modes, pictures, GIFs, drawing, live animations, clock/CPU/music"
license = "MIT"
repository = "https://github.com/OlexiyOdarchuk/corne-hud"
readme = "README.md"
keywords = ["corne", "qmk", "vial", "oled", "keyboard"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.31"
libc = "0.2"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui-phosphor = "0.9"

[profile.release]
lto = "thin"
strip = true
